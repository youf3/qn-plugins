[scheduling]
# Pre-entanglement scheduling — whether to move entanglement_gen commands earlier
# in the QPU schedule to overlap Bell-pair generation latency with local gate execution.
pre_schedule_entanglement = true

# Expected Bell-pair generation latency in nanoseconds. Used to estimate how much
# gate execution time can hide entanglement latency during pre-scheduling.
expected_ent_latency_ns = 1000000

# Estimated duration of a single-qubit gate in nanoseconds.
one_q_gate_duration_ns = 5000

# Estimated duration of a two-qubit gate in nanoseconds.
two_q_gate_duration_ns = 10700

# Duration of one DQC timeslot in milliseconds. Multiple DQC timeslots may fit
# inside a single agent scheduler slot (SLOTSIZE = 100ms per Constants).
dqc_timeslot_ms = 3
