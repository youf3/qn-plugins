---
asyncapi: "2.6.0"
id: "urn:gov:quant-net"
info:
  description: "Quant-Net RPC Link Calibration Interface"
  title: "RPC SPG Endpoint"
  version: "1.0.0"
components:
  messages:
    RequestMessage:
      name: linkCalRequest
      messageId: linkCal.request.id
      payload:
        "$ref": "#/components/schemas/linkCalRequest"
    ResponseMEssage:
      name: linkCalResponse
      messageId: linkCal.response.id
      payload:
        "$ref": "#/components/schemas/linkCalResponse"
  schemas:
    linkCalRequest:
      title: linkCalRequest
      type: object
      required:
        - cmd
        - agentId
        - payload
      properties:
        cmd:
          type: string
        agentId:
          type: string
        payload:
          type: object
          required:
            - nodes            
          properties:
            nodes:
              type: array
              minItems: 1
              items:
                type: string
    linkCalQuery:
      title: linkCalQuery
      type: object
      required:
        - cmd
        - agentId
        - payload
      properties:
        cmd:
          type: string
        agentId:
          type: string
        payload:
          type: object
          required:
            - rid
          properties:
            rid:
              type: string
    linkCalResponse:
      title:  linkCalResponse
      type: object
      required:
        - status
      properties:
        status:
          $ref: "qn-schema:objects/objects.yaml#/components/schemas/Status"
        rid:
          type: string
        data:
          type: array
          items:
            type: object
    linkCalRequestRecord:
      title: linkCalRequestRecord
      type: object
      required:
        - phase
        - rid
      properties:
        phase:
          type: string
        rid:
          type: string
        data:
          type: object
        nodes:
          type: array
          minItems: 1
          items:
            type: string
defaultContentType: application/json
