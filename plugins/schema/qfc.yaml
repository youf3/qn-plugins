---
asyncapi: "2.6.0"
id: "urn:gov:quant-net"
info:
  description: "Quant-Net RPC QFC Experiment Interface"
  title: "RPC SPG Endpoint"
  version: "1.0.0"
components:
  messages:
    RequestMessage:
      name: qfcRequest
      messageId: qfc.request.id
      payload:
        "$ref": "#/components/schemas/qfcRequest"
    ResponseMEssage:
      name: qfcResponse
      messageId: qfc.response.id
      payload:
        "$ref": "#/components/schemas/QFCResponse"
  schemas:
    qfcRequest:
      title: qfcRequest
      type: object
      required:
        - cmd
        - agentId
        - payload
      properties:
        cmd:
          type: string
        agentId:
          type: string
        payload:
          type: object
          required:
            - nodes            
          properties:
            nodes:
              type: array
              minItems: 1
              items:
                type: string
    qfcQuery:
      title: qfcQuery
      type: object
      required:
        - cmd
        - agentId
        - payload
      properties:
        cmd:
          type: string
        agentId:
          type: string
        payload:
          type: object
          required:
            - rid
          properties:
            rid:
              type: string
    QFCResponse:
      title:  qfcResponse
      type: object
      required:
        - status
      properties:
        status:
          $ref: "qn-schema:objects/objects.yaml#/components/schemas/Status"
        rid:
          type: string
        data:
          type: array
          items:
            type: object
    qfcRequestRecord:
      title: qfcRequestRecord
      type: object
      required:
        - phase
        - rid
      properties:
        phase:
          type: string
        rid:
          type: string
        data:
          type: object
        nodes:
          type: array
          minItems: 1
          items:
            type: string
defaultContentType: application/json
